<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crafting Release Artifacts</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-bg: #ffffff;
      --color-header-bg: #1a1a2e;
      --color-header-text: #e8e8f0;
      --color-accent: #0ea5e9;
      --color-accent-hover: #38bdf8;
      --color-text: #1f2937;
      --color-text-muted: #6b7280;
      --color-border: #e5e7eb;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ──────────────────────────────────────── */
    header {
      background: var(--color-header-bg);
      padding: 0 2rem;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .logo-mark {
      width: 28px;
      height: 28px;
      background: var(--color-accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-mark svg {
      width: 16px;
      height: 16px;
      fill: white;
    }

    .logo-text {
      color: var(--color-header-text);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    /* ── Main content ────────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
    }

    .card {
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-accent);
      background: rgba(14, 165, 233, 0.08);
      border: 1px solid rgba(14, 165, 233, 0.2);
      border-radius: 999px;
      padding: 0.25rem 0.75rem;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--color-text);
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }

    .description {
      font-size: 1rem;
      color: var(--color-text-muted);
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    hr.divider {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: 2rem 0;
    }

    .cta-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--color-accent);
      text-decoration: none;
      border: 1px solid rgba(14, 165, 233, 0.35);
      border-radius: 6px;
      padding: 0.55rem 1.25rem;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .cta-link:hover {
      background: rgba(14, 165, 233, 0.08);
      color: var(--color-accent-hover);
      border-color: var(--color-accent-hover);
    }

    .cta-link svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── Footer ──────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 1.25rem 2rem;
      font-size: 0.8rem;
      color: var(--color-text-muted);
      border-top: 1px solid var(--color-border);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-mark" aria-hidden="true">
      <!-- Simple cube / crafting icon -->
      <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 1 L14 4.5 L14 11.5 L8 15 L2 11.5 L2 4.5 Z" fill="none" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
        <line x1="8" y1="1" x2="8" y2="8" stroke="white" stroke-width="1.5"/>
        <line x1="8" y1="8" x2="14" y2="4.5" stroke="white" stroke-width="1.5"/>
        <line x1="8" y1="8" x2="2" y2="4.5" stroke="white" stroke-width="1.5"/>
      </svg>
    </div>
    <span class="logo-text">Crafting</span>
  </header>

  <main>
    <div class="card">
      <span class="badge">Artifacts</span>
      <h1>Crafting Release Artifacts</h1>
      <p class="description">
        Versioned release artifacts produced by the Crafting pipeline,
        ready for deployment and distribution.
      </p>
      <hr class="divider" />
      <a class="cta-link" href="https://github.com/crafting-dev/release" target="_blank" rel="noopener noreferrer">
        See details
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </a>
    </div>
  </main>

  <footer>
    &copy; Crafting &mdash; <a href="https://docs.sandboxes.cloud" style="color: inherit; text-decoration: underline;">docs.sandboxes.cloud</a>
  </footer>

</body>
</html>
