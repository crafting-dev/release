<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crafting Release Artifacts</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-bg: #ffffff;
      --color-banner-bg: #002127;
      --banner-height: 4.5rem;
      --color-accent: #0ea5e9;
      --color-accent-hover: #38bdf8;
      --color-text: #1f2937;
      --color-text-muted: #6b7280;
      --color-border: #e5e7eb;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Banner (matches docs.sandboxes.cloud) ───────── */
    #banner {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      height: var(--banner-height);
      padding: 0 1.25rem;
      background: var(--color-banner-bg);
      box-shadow: 0 0.0625rem 0.25rem rgba(0, 0, 0, 0.3);
    }

    #banner .logo a {
      display: block;
      width: 10.75rem;
      height: 2.42rem;
      background-image: url('crafting.svg');
      background-repeat: no-repeat;
      background-size: 10.75rem 2.42rem;
      text-decoration: none;
      opacity: 1;
      transition: opacity 0.15s;
    }

    #banner .logo a:hover {
      opacity: 0.85;
      text-decoration: none;
    }

    /* ── Main content ────────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
    }

    .card {
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-accent);
      background: rgba(14, 165, 233, 0.08);
      border: 1px solid rgba(14, 165, 233, 0.2);
      border-radius: 999px;
      padding: 0.25rem 0.75rem;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--color-text);
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }

    .description {
      font-size: 1rem;
      color: var(--color-text-muted);
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    hr.divider {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: 2rem 0;
    }

    .cta-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--color-accent);
      text-decoration: none;
      border: 1px solid rgba(14, 165, 233, 0.35);
      border-radius: 6px;
      padding: 0.55rem 1.25rem;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .cta-link:hover {
      background: rgba(14, 165, 233, 0.08);
      color: var(--color-accent-hover);
      border-color: var(--color-accent-hover);
    }

    .cta-link svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── Footer ──────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 1.25rem 2rem;
      font-size: 0.8rem;
      color: var(--color-text-muted);
      border-top: 1px solid var(--color-border);
    }
  </style>
</head>
<body>

  <header id="banner">
    <div class="logo">
      <a href="https://docs.sandboxes.cloud" aria-label="Crafting Sandbox"></a>
    </div>
  </header>

  <main>
    <div class="card">
      <span class="badge">Artifacts</span>
      <h1>Crafting Release Artifacts</h1>
      <p class="description">
        Versioned release artifacts produced by the Crafting pipeline,
        ready for deployment and distribution.
      </p>
      <hr class="divider" />
      <a class="cta-link" href="https://github.com/crafting-dev/release" target="_blank" rel="noopener noreferrer">
        See details
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </a>
    </div>
  </main>

  <footer>
    &copy; Crafting &mdash; <a href="https://docs.sandboxes.cloud" style="color: inherit; text-decoration: underline;">docs.sandboxes.cloud</a>
  </footer>

</body>
</html>
